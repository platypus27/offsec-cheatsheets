title: Password and protected-file recovery
description: Identify recovered material, select the matching offline format or policy-aware online check, then verify one intended use.
start: material
nodes:
  material:
    phase: Credential access
    prompt: What material do you actually have?
    body: Record account authority, source file/service, capture method and the complete value. A detector's guess is not provenance.
    links: [passwords/cracking#choose-the-format]
    options:
      - { label: Protected archive or private key, next: extract }
      - { label: Hash with verified provenance, next: offline }
      - { label: Kerberos roasting material, next: kerberos }
      - { label: Candidate password for an online service, next: policy }
  extract:
    phase: Credential access
    prompt: Extract the matching protected-file format.
    body: Choose only the converter for the recovered file. Keep the original and read extraction errors before starting a cracking job.
    commands: [passwords/cracking#protected-archive-extraction, passwords/cracking#ssh-private-key-extraction, passwords/cracking#keepass-database-extraction]
    options:
      - { label: Matching material extracted, next: offline }
      - { label: Password already recovered, next: verify }
      - { label: Unsupported or unclear format, next: material }
  offline:
    phase: Credential access
    prompt: Run the job with the verified format and a justified candidate set.
    body: Set HASH_MODE from the actual format. Parser errors require input correction; an exhausted list does not prove the format was correct.
    commands: [passwords/cracking#hashcat-dictionary-job, passwords/cracking#rules-results-and-resume]
    options:
      - { label: Secret recovered, next: verify }
      - { label: Parser or format failure, next: material }
      - { label: Candidates exhausted, next: reassess }
  kerberos:
    phase: Credential access
    prompt: Match AS-REP or TGS and its encryption type before cracking.
    commands: [active-directory/kerberos#kerberos-hash-modes]
    links: [active-directory/kerberos#as-rep-roasting, active-directory/kerberos#kerberoasting]
    options:
      - { label: Exact format identified, next: offline }
      - { label: Material still unclear, next: material }
  policy:
    phase: Credential access
    prompt: Confirm the account scope and attempt budget before online checks.
    links: [passwords/online#policy-and-attempt-ledger, active-directory/ad-enumeration#password-policy-and-kerberos-controls]
    options:
      - { label: One recovered credential to validate, next: verify }
      - { label: Authorized SSH candidate list and attempt budget, next: ssh }
      - { label: HTTP form requiring request validation, next: form }
      - { label: Policy or scope unclear, next: reassess }
  ssh:
    phase: Credential access
    prompt: Test the confirmed SSH service within the recorded attempt budget.
    commands: [passwords/online#ssh-password-check]
    options:
      - { label: Candidate succeeds, next: verify }
      - { label: Stop or no result, next: reassess }
  form:
    phase: Web testing
    prompt: Verify the actual request and success/failure indicators.
    commands: [passwords/online#http-form-validation]
    links: [web/http-workflow#save-and-replay-in-burp]
    options:
      - { label: Credential recovered, next: verify }
      - { label: Static automation does not fit the app, next: reassess }
  verify:
    phase: Initial access
    prompt: Verify one intended account and service.
    body: Choose the appropriate protocol and authority. SMB success does not prove WinRM, RDP or administrator execution rights.
    commands: [passwords/online#validate-one-recovered-credential]
    links: [services/remote-access, services/common-services#ssh]
    options:
      - { label: Result and provenance recorded, next: reassess }
  reassess:
    phase: Evidence
    prompt: Record the result and next evidence-backed check.
    links: [field-guide/methodology#close-a-session, troubleshooting/identity]
    options:
      - { label: Different recovered material, next: material }
